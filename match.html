<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fotogaléria futbalového zápasu od Jakuba Šperku.">
  <title>Zápas | Jakub Šperka Photography</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
  <link rel="shortcut icon" href="images/favicon/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="Jakub Šperka Photography">
        <span class="brand-main">JAKUB ŠPERKA</span>
        <span class="brand-sub">PHOTOGRAPHY</span>
      </a>

      <nav class="nav">
        <a href="index.html" class="active">Zápasy</a>
        <a href="about.html">O mne</a>
      </nav>
    </div>
  </header>

  <main class="match-page">
    <section class="container match-header">
      <a href="index.html" class="back-link">← Späť na zápasy</a>

      <div id="match-meta" class="match-meta"></div>
      <h1 id="match-title">Načítavam zápas…</h1>
      <p id="match-details" class="match-details"></p>
    </section>

    <section class="container">
      <div id="gallery-actions" class="gallery-actions" hidden>
        <div class="gallery-actions-copy">
          <span class="gallery-actions-label">Samostatná fotogaléria</span>
          <p>
            Otvor kompletný album v samostatnom okne pre pohodlnejšie prezeranie
            a sťahovanie fotografií.
          </p>
        </div>

        <a
          id="ente-album-link"
          class="ente-album-button"
          target="_blank"
          rel="noopener noreferrer">
          Otvoriť celú galériu
          <span class="ente-album-button-arrow" aria-hidden="true">↗</span>
        </a>
      </div>

      <div id="gallery-wrap" class="gallery-wrap">
        <iframe
          id="ente-gallery"
          title="Ente fotogaléria"
          loading="lazy"
          allowfullscreen>
        </iframe>
      </div>

      <p id="match-error" class="empty-state" hidden>
        Zápas sa nepodarilo nájsť.
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Jakub Šperka Photography</span>
      <span id="footer-year"></span>
    </div>
  </footer>

  <script src="js/match.js"></script>
</body>
</html>
